spring.application.name=smart-home-api

# Configuration de la base de données H2 (en mémoire)
spring.datasource.url=jdbc:h2:mem:smarthome
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# La ligne MAGIQUE qui dit à Hibernate de créer les tables automatiquement
spring.jpa.hibernate.ddl-auto=update

# Pour que Hibernate sache qu'on utilise H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Optionnel mais TRES utile : Activer la console web de la base de données
spring.h2.console.enabled=true